<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 465 75" fill="none">
  <defs>
    <!-- Reddish Brand Gradient -->
    <linearGradient id="mzFullGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E50914" />
      <stop offset="35%" stop-color="#FF2D55" />
      <stop offset="70%" stop-color="#FF3B30" />
      <stop offset="100%" stop-color="#E50914" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Glowing Play Emblem Icon -->
  <g transform="translate(8, 8)">
    <circle cx="29" cy="29" r="28" fill="url(#mzFullGradient)" filter="url(#glow)" opacity="0.95" />
    <circle cx="29" cy="29" r="22" fill="#0A0A0E" />
    <!-- Glowing Play Triangle -->
    <path d="M23 18 L40 29 L23 40 Z" fill="url(#mzFullGradient)" />
    <!-- Accent Dots -->
    <circle cx="29" cy="11" r="2.2" fill="#FFF" opacity="0.9" />
    <circle cx="29" cy="47" r="2.2" fill="#FFF" opacity="0.9" />
    <circle cx="11" cy="29" r="2.2" fill="#FFF" opacity="0.9" />
    <circle cx="47" cy="29" r="2.2" fill="#FFF" opacity="0.9" />
  </g>

  <!-- Reddish Gradient Typography for MOVIE ZONE -->
  <text x="76" y="49" font-family="'Outfit', 'Inter', 'Arial Black', sans-serif" font-weight="900" font-size="35" letter-spacing="1.5">
    <tspan fill="url(#mzFullGradient)">MOVIE</tspan>
    <tspan fill="#FFFFFF"> </tspan>
    <tspan fill="url(#mzFullGradient)">ZONE</tspan>
  </text>

  <!-- Ugandan VJ PULSE Pill Badge with Generous Spacing -->
  <g transform="translate(355, 24)">
    <rect x="0" y="0" width="96" height="26" rx="6" fill="url(#mzFullGradient)" />
    <text x="48" y="17" font-family="'Outfit', 'Inter', sans-serif" font-weight="900" font-size="11" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">
      VJ PULSE
    </text>
  </g>
</svg>
