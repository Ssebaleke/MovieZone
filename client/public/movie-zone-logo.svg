<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 430 75" fill="none">
  <defs>
    <linearGradient id="mzGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E50914" />
      <stop offset="50%" stop-color="#FF3B30" />
      <stop offset="100%" stop-color="#FF9500" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Film Reel & Play Icon -->
  <g transform="translate(10, 10)">
    <circle cx="28" cy="28" r="26" fill="url(#mzGradient)" />
    <circle cx="28" cy="28" r="21" fill="#0A0A0C" />
    <!-- Play Triangle -->
    <path d="M22 17 L38 28 L22 39 Z" fill="url(#mzGradient)" filter="url(#glow)" />
    <!-- Accent Dots -->
    <circle cx="28" cy="10" r="2" fill="#FFF" opacity="0.9" />
    <circle cx="28" cy="46" r="2" fill="#FFF" opacity="0.9" />
    <circle cx="10" cy="28" r="2" fill="#FFF" opacity="0.9" />
    <circle cx="46" cy="28" r="2" fill="#FFF" opacity="0.9" />
  </g>

  <!-- Brand Typography -->
  <text x="75" y="47" font-family="'Inter', 'Arial Black', sans-serif" font-weight="900" font-size="34" fill="#FFFFFF" letter-spacing="1">
    MOVIE<tspan fill="url(#mzGradient)" font-weight="900">ZONE</tspan>
  </text>

  <!-- Ugandan VJ Badge Pill - Well spaced with clean gap -->
  <g transform="translate(325, 25)">
    <rect x="0" y="0" width="82" height="24" rx="5" fill="url(#mzGradient)" />
    <text x="41" y="16" font-family="'Inter', sans-serif" font-weight="900" font-size="11" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.8">
      VJ PLUS
    </text>
  </g>
</svg>
