name: Auto Deploy to VPS Server

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to Production VPS
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy via SSH Key to VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USERNAME }}
          VPS_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          TARGET_HOST="${VPS_HOST:-69.164.245.17}"
          TARGET_USER="${VPS_USER:-root}"

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          if [ -n "$VPS_KEY" ]; then
            echo "$VPS_KEY" > ~/.ssh/id_rsa
          else
