name: Auto Deploy to VPS Server

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to Production VPS
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy via SSH Key to VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USERNAME }}
          VPS_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          TARGET_HOST="${VPS_HOST:-69.164.245.17}"
          TARGET_USER="${VPS_USER:-root}"

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          if [ -z "$VPS_KEY" ]; then
            echo "ERROR: VPS_SSH_KEY secret is not set. Add it in GitHub repo Settings > Secrets > Actions."
            exit 1
          fi

          echo "$VPS_KEY" > ~/.ssh/id_rsa

          chmod 600 ~/.ssh/id_rsa

          echo "Connecting to $TARGET_HOST..."
          ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -i ~/.ssh/id_rsa "$TARGET_USER@$TARGET_HOST" "export PATH=\$PATH:/usr/local/bin:/usr/bin; cd /root/MovieZone && git fetch origin main && git reset --hard origin/main && (docker-compose build || docker compose build) && (docker-compose up -d --force-recreate || docker compose up -d --force-recreate)"

          echo "===> Auto-deployment finished successfully!"
