name: Auto Deploy to VPS Server

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to Production VPS
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy via SSH to VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USERNAME }}
          VPS_PASS: ${{ secrets.VPS_PASSWORD }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y sshpass -qq

          echo "Connecting to $VPS_HOST via SSH..."
          sshpass -p "$VPS_PASS" ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null "$VPS_USER@$VPS_HOST" "export PATH=\$PATH:/usr/local/bin:/usr/bin; cd /root/MovieZone && git fetch origin main && git reset --hard origin/main && docker-compose build && docker-compose up -d --force-recreate"

          echo "===> Auto-deployment completed successfully on VPS!"
