version: '3.8'

services:
  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: moviezone_backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - DATABASE_URL=file:./prisma/dev.db
      - JWT_SECRET=moviezone_jwt_secret_key_12345!
      - CLIENT_URL=http://localhost
      - REELPLEXI_API_KEY=${REELPLEXI_API_KEY:-}
    volumes:
      - db_data:/app/prisma

  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: moviezone_frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  db_data:
